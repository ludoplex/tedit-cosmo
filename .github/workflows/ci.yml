name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  release:
    types: [created]

env:
  COSMOCC_VERSION: "3.9.7"

jobs:
  # Security scanning (runs first, fail fast)
  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@0.34.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  # Lint and static analysis
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check header guards
        run: |
          echo "Checking header guards..."
          for f in include/*.h; do
            if ! grep -q "#ifndef" "$f"; then
              echo "❌ Missing header guard in $f"
              exit 1
            fi
          done
          echo "✅ All header guards present"

      - name: Check for common C issues
        run: |
          echo "Checking for dangerous functions..."
          if grep -rn "gets\s*(" src/ include/; then
            echo "❌ Found unsafe gets() - use fgets() instead"
            exit 1
          fi
          if grep -rn "sprintf\s*(" src/ include/ | grep -v snprintf; then
            echo "⚠️  Found sprintf() - consider snprintf() for safety"
          fi
          echo "✅ Basic safety checks passed"

      - name: Check formatting consistency
        run: |
          # Check for mixed tabs/spaces
          echo "Checking indentation consistency..."
          find src include -name "*.c" -o -name "*.h" | while read f; do
            if grep -qP "^\t" "$f" && grep -qP "^  " "$f"; then
              echo "⚠️  Mixed tabs/spaces in $f"
            fi
          done
          echo "✅ Formatting check complete"

  # Primary build: Cross-platform APE using cosmocc
  build-ape:
    runs-on: ubuntu-latest
    needs: [security, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cosmocc toolchain
        id: cache-cosmocc
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-linux-v3

      - name: Install cosmocc toolchain
        if: steps.cache-cosmocc.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p $GITHUB_WORKSPACE/cosmocc
          cd $GITHUB_WORKSPACE/cosmocc
          echo "Downloading cosmocc toolchain..."
          curl -fsSL "https://cosmo.zip/pub/cosmocc/cosmocc.zip" -o cosmocc.zip
          echo "Extracting..."
          unzip -q cosmocc.zip
          rm cosmocc.zip
          echo "Installed cosmocc toolchain:"
          ls -la $GITHUB_WORKSPACE/cosmocc/bin/ | head -10
          $GITHUB_WORKSPACE/cosmocc/bin/cosmocc --version || true

      - name: Setup APE loader for Linux
        run: |
          if [ -f $GITHUB_WORKSPACE/cosmocc/bin/ape-x86_64.elf ]; then
            sudo cp $GITHUB_WORKSPACE/cosmocc/bin/ape-x86_64.elf /usr/bin/ape
            sudo chmod +x /usr/bin/ape
          elif [ -f $GITHUB_WORKSPACE/cosmocc/bin/ape.elf ]; then
            sudo cp $GITHUB_WORKSPACE/cosmocc/bin/ape.elf /usr/bin/ape
            sudo chmod +x /usr/bin/ape
          fi
          if [ -f /proc/sys/fs/binfmt_misc/register ]; then
            sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" 2>/dev/null || true
          fi

      - name: Build CLI version
        run: |
          export PATH="$GITHUB_WORKSPACE/cosmocc/bin:$PATH"
          make clean || true
          make cli

      - name: Verify APE binary
        run: |
          ls -la tedit.com
          file tedit.com
          ./tedit.com --help || true
          echo "✅ Linux x86_64 verification complete"

      - name: Create embedded resources
        run: |
          mkdir -p .cosmo
          echo "tedit-cosmo - Actually Portable Text Editor" > .cosmo/README
          echo "$(git describe --tags 2>/dev/null || echo 'dev')" > .cosmo/VERSION
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .cosmo/BUILD_TIME
          echo "linux,macos,windows,freebsd,openbsd,netbsd" > .cosmo/PLATFORMS
          
          # Include default config files
          cp menuini.txt .cosmo/ 2>/dev/null || true
          cp build.ini .cosmo/ 2>/dev/null || true
          cp backup.ini .cosmo/ 2>/dev/null || true
          
          zip -r resources.zip .cosmo/
          cat resources.zip >> tedit.com
          chmod +x tedit.com
          
          echo "Embedded ZipOS contents:"
          unzip -l tedit.com 2>/dev/null | tail -10 || true

      - name: Upload APE artifact
        uses: actions/upload-artifact@v4
        with:
          name: tedit-cosmo-ape
          path: tedit.com
          retention-days: 30

  # Test APE on macOS Intel
  test-macos-intel:
    needs: build-ape
    runs-on: macos-15
    steps:
      - name: Download APE artifact
        uses: actions/download-artifact@v4
        with:
          name: tedit-cosmo-ape

      - name: Test APE on macOS Intel
        run: |
          chmod +x tedit.com
          ./tedit.com --help || echo "Help displayed"
          ./tedit.com --version || true
          echo "✅ macOS Intel (x86_64) verification complete"

  # Test APE on macOS Apple Silicon
  test-macos-arm:
    needs: build-ape
    runs-on: macos-latest
    steps:
      - name: Download APE artifact
        uses: actions/download-artifact@v4
        with:
          name: tedit-cosmo-ape

      - name: Test APE on macOS ARM
        run: |
          chmod +x tedit.com
          ./tedit.com --help || echo "Help displayed"
          ./tedit.com --version || true
          echo "✅ macOS Apple Silicon (arm64) verification complete"

  # Build using setup-cosmocc action (experimental/faster)
  build-ape-action:
    runs-on: ubuntu-latest
    needs: [security, lint]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cosmocc
        uses: bjia56/setup-cosmocc@main
        with:
          version: latest

      - name: Build tedit (APE via action)
        run: |
          make clean || true
          make cli CC=cosmocc

      - name: Verify build
        run: |
          ls -la tedit.com
          file tedit.com || true

  # Native Linux build for fast CI testing
  test-native-linux:
    runs-on: ubuntu-latest
    needs: [security, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build and test (native gcc)
        run: |
          make clean || true
          make cli CC=gcc
          ./tedit.com --help || true
          echo "✅ Native Linux build test passed"

  # Build with macOS native toolchain
  build-macos:
    runs-on: macos-latest
    needs: [security, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cosmocc toolchain (macOS)
        id: cache-cosmocc-macos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cosmocc
          key: cosmocc-${{ env.COSMOCC_VERSION }}-macos-v3

      - name: Install cosmocc toolchain (macOS)
        if: steps.cache-cosmocc-macos.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p $GITHUB_WORKSPACE/cosmocc
          cd $GITHUB_WORKSPACE/cosmocc
          curl -fsSL "https://cosmo.zip/pub/cosmocc/cosmocc.zip" -o cosmocc.zip
          unzip -q cosmocc.zip
          rm cosmocc.zip
          $GITHUB_WORKSPACE/cosmocc/bin/cosmocc --version || true

      - name: Build tedit on macOS
        run: |
          make clean || true
          make cli CC=$GITHUB_WORKSPACE/cosmocc/bin/cosmocc

      - name: Test build
        run: |
          chmod +x tedit.com
          ./tedit.com --help || true

  # Release job
  release:
    needs: [build-ape, test-macos-intel, test-macos-arm]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download APE artifact
        uses: actions/download-artifact@v4
        with:
          name: tedit-cosmo-ape

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: tedit.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
